name: Update Hatz videos and map

on:
  schedule:
    - cron: "17 13 * * *"      # every day at about 9:17 AM Eastern
  workflow_dispatch:            # lets you press "Run workflow" by hand
    inputs:
      backfill:
        description: "Import the whole video archive (needs the YOUTUBE_API_KEY secret)"
        type: boolean
        default: false
  push:
    paths:
      - "data/decisions.json"   # runs right after you save choices from the review page

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull new videos and rebuild the site
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # optional, see README
        run: python tools/update.py ${{ inputs.backfill && '--backfill' || '' }}

      - name: Save changes
        run: |
          git config user.name "hatz-bot"
          git config user.email "hatz-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update videos and map" && git push)

      - name: Email me when a video needs a location
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/update.py --notify
